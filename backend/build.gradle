plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.invi'
version = '0.0.1-SNAPSHOT'
description = 'Mobile wedding invitation service API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.54.14')
	// Cloudflare R2 is S3-compatible; the AWS SDK v2 S3 client/presigner work against it
	// unmodified once pointed at the account's R2 endpoint. See media/R2StorageConfig.
	// S3Presigner lives in this module too (no separate s3-presigner artifact in v2).
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	// Hibernate's JSON column mapping (@JdbcTypeCode(SqlTypes.JSON)) still resolves against
	// Jackson 2, even though spring-boot-starter-jackson brings Jackson 3 for the HTTP layer.
	// See CLAUDE.md's JSONB section for the Jackson 2/3 boundary this creates.
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Theme presets are owned by the frontend editor; TemplateSeeder reads the same file
// so template codes and default designs cannot drift between the two (CLAUDE.md).
tasks.named('processResources') {
	from('../frontend/src/editor/themes.json') {
		into 'presets'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
