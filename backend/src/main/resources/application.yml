spring:
  application:
    name: invi-api
  datasource:
    url: jdbc:postgresql://localhost:5433/invi
    username: invi
    password: invi
  flyway:
    # Databases that ddl-auto built before Flyway have tables but no history: mark them
    # as V1 and let V2 catch them up. An empty database runs every migration.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

invi:
  jwt:
    # Local-dev-only fallback. application-local.yml (gitignored) overrides this
    # with a real secret — never commit an actual signing key.
    secret: ${JWT_SECRET:dev-only-insecure-default-0123456789abcdef0123456789abcdef}
    expiration-minutes: 43200
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  r2:
    # account-id/access-key-id/secret-access-key are deliberately NOT defaulted here —
    # R2StorageConfig only wires its S3 beans when invi.r2.account-id resolves to a
    # non-blank value, so the app still boots without real credentials (CI, fresh clone,
    # etc). Set real values via application-local.yml (gitignored) or env vars
    # (INVI_R2_ACCOUNT_ID / INVI_R2_ACCESS_KEY_ID / INVI_R2_SECRET_ACCESS_KEY).
    bucket: ${R2_BUCKET:invi-media}
    public-base-url: ${R2_PUBLIC_BASE_URL:}

    cleanup:
      # Tracking/reference guards always run; automatic sweeps are opt-in.
      enabled: ${R2_CLEANUP_ENABLED:false}
      dry-run: ${R2_CLEANUP_DRY_RUN:true}
      grace-period: ${R2_CLEANUP_GRACE_PERIOD:P7D}
      interval: PT1H
      initial-delay: PT5M
      max-objects: 10000
      batch-size: 100
