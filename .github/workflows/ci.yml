name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invi
          POSTGRES_USER: invi
          POSTGRES_PASSWORD: invi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U invi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --console=plain

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck & build default mode
        working-directory: frontend
        run: npm run build
      - name: Build same-origin HTTPS test mode
        working-directory: frontend
        run: npm run build:https-test

  https-test-image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged HTTPS test image without deployment secrets
        run: docker build --tag invi-https-test:ci .
